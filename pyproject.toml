[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devdigest"
version = "0.1.0"
description = "AI-powered CLI that transforms GitHub releases into executive technical briefings."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "David Aires", email = "david@example.com" }
]
keywords = ["cli", "ai", "gemini", "github", "releases", "developer-tools", "automation"]
dependencies = [
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
devdigest = "devdigest.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["devdigest*"]

[tool.pytest.ini_options]
pythonpath = ["."]
